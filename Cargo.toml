[workspace]
members = [
  "crates/adapters/apple-speech",
  "crates/cuttledoc",
  "crates/cuttledoc-cli",
  "crates/cuttledoc-models",
  "crates/cuttledoc-node",
]
exclude = [
  "spikes/coreml-rust",
  "spikes/node-api/native",
  "spikes/stream-contract",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sebastian-software/cuttledoc-rs"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
