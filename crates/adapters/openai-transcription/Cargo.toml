[package]
name = "cuttledoc-openai-transcription"
description = "Private portable OpenAI transcription boundary for Cuttledoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "=1.12.1"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time"] }

[lints]
workspace = true
