name: Node package

on:
  pull_request:
    paths:
      - ".github/workflows/node-package.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/adapters/apple-speech/**"
      - "crates/adapters/gemma-mlx/**"
      - "crates/adapters/openrouter/**"
      - "crates/adapters/whisper/**"
      - "crates/cuttledoc-audio/**"
      - "crates/cuttledoc/**"
      - "crates/cuttledoc-node/**"
      - "packages/cuttledoc/**"
      - "scripts/pack-cuttledoc-node.sh"
      - "scripts/fetch-whisper-cpp.sh"
      - "scripts/fetch-official-mlx.sh"
      - "scripts/test-cuttledoc-node-package.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/node-package.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/adapters/apple-speech/**"
      - "crates/adapters/gemma-mlx/**"
      - "crates/adapters/openrouter/**"
      - "crates/adapters/whisper/**"
      - "crates/cuttledoc-audio/**"
      - "crates/cuttledoc/**"
      - "crates/cuttledoc-node/**"
      - "packages/cuttledoc/**"
      - "scripts/pack-cuttledoc-node.sh"
      - "scripts/fetch-whisper-cpp.sh"
      - "scripts/fetch-official-mlx.sh"
      - "scripts/test-cuttledoc-node-package.sh"

permissions:
  contents: read

jobs:
  packed-artifact:
    name: Packed artifact / Node ${{ matrix.node }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build, pack, install, and test
        run: bash scripts/test-cuttledoc-node-package.sh
